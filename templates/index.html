<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230d0f12'/><text x='50' y='72' font-family='sans-serif' font-size='42' font-weight='bold' fill='%23ff3b3b' text-anchor='middle'>YT</text></svg>">
<title>YTunes</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg:        #0d0f12;
    --surface:   #161920;
    --surface2:  #1e2229;
    --border:    #2a2f3a;
    --accent:    #ff3b3b;
    --accent-soft: rgba(255,59,59,0.10);
    --chrome-1:  #f2f3f5;
    --chrome-2:  #9aa0aa;
    --chrome-3:  #5b606a;
    --gray:      #8a909a;
    --gray-soft: rgba(154,160,170,0.10);
    --danger:    #ff6b6b;
    --text:      #e8ecf1;
    --muted:     #7a8290;
    --radius:    12px;
    --radius-sm: 9px;
    --mono:      'DM Mono', monospace;
    --sans:      'Syne', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 0 0 80px;
    font-size: 15px;
  }

  header { padding: 24px 20px 4px; max-width: 720px; margin: 0 auto; }

  .brand {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(180deg, var(--chrome-1) 0%, var(--chrome-3) 45%, var(--chrome-1) 55%, var(--chrome-2) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .brand span { color: var(--accent); -webkit-text-fill-color: var(--accent); }

  .subtitle { color: var(--muted); font-size: 14px; margin-top: 3px; }

  main { max-width: 720px; margin: 0 auto; padding: 20px; }

  .input-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 24px;
    display: flex;
    gap: 8px;
  }

  input[type="text"] {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: var(--mono);
    font-size: 15px;
    padding: 11px 14px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: var(--muted); }

  /* ---------- Buttons: rounded-square outlines, icon-forward ---------- */
  button { cursor: pointer; font-family: var(--sans); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    background: transparent;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--accent);
    color: var(--accent);
    font-weight: 700;
    font-size: 13px;
    padding: 10px 16px;
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) { background: var(--accent-soft); }
  .btn.gray { border-color: var(--gray); color: var(--chrome-1); }
  .btn.gray:hover:not(:disabled) { background: var(--gray-soft); }
  .btn.small { padding: 7px 12px; font-size: 12px; }
  .btn.icon-only { width: 38px; height: 38px; padding: 0; flex-shrink: 0; }
  .btn.icon-only.small { width: 32px; height: 32px; font-size: 13px; }

  .list-header {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .empty { color: var(--muted); font-size: 14px; padding: 24px 0; text-align: center; }

  .queue-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 14px;
    padding: 16px 18px;
    transition: border-color 0.2s;
  }
  .queue-card.status-needs_review { border-left-color: var(--accent); }
  .queue-card.status-complete { border-left-color: #3ecf72; }
  .queue-card.status-error { border-left-color: var(--danger); }
  .queue-card.status-queued, .queue-card.status-fetching_info,
  .queue-card.status-downloading, .queue-card.status-analyzing,
  .queue-card.status-tagging { border-left-color: var(--chrome-2); }

  .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card-header-title { font-weight: 700; font-size: 16px; line-height: 1.3; }
  .card-sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }

  .status-badge {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: var(--radius-sm);
    background: var(--surface2);
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .status-badge.needs_review { background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(255,59,59,0.3); }
  .status-badge.complete { background: rgba(62,207,114,0.12); color: #3ecf72; }
  .status-badge.error { background: rgba(255,107,107,0.12); color: var(--danger); }

  .card-error {
    margin-top: 10px;
    font-size: 13px;
    font-family: var(--mono);
    color: var(--danger);
    background: rgba(255,107,107,0.08);
    border: 1px solid rgba(255,107,107,0.25);
    border-radius: var(--radius-sm);
    padding: 9px 11px;
  }

  /* ---------- Review stack: everything full-width, vertical ---------- */
  .review-stack { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }

  .info-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .info-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .info-body { display: flex; gap: 12px; align-items: center; }
  .info-art {
    width: 60px; height: 60px; border-radius: 8px; object-fit: cover;
    background: var(--surface); border: 1px solid var(--border); flex-shrink: 0;
  }
  .info-text { min-width: 0; flex: 1; }
  .info-title { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .info-meta { font-size: 13px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .info-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .confidence-badge {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: var(--radius-sm);
    display: inline-block;
    white-space: nowrap;
  }
  .confidence-high { background: rgba(255,59,59,0.18); color: #ff6b6b; border: 1px solid rgba(255,59,59,0.4); }
  .confidence-mid  { background: var(--gray-soft); color: var(--chrome-1); border: 1px solid rgba(154,160,170,0.3); }
  .confidence-low  { background: var(--surface); color: var(--muted); border: 1px dashed var(--border); }

  .more-matches-row { display: flex; gap: 8px; }
  .more-matches-row input { flex: 1; }

  .other-matches { display: flex; flex-direction: column; gap: 8px; }
  .other-matches-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted);
  }
  .other-match-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 9px 12px; gap: 10px;
  }
  .other-match-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .other-match-info img { width: 34px; height: 34px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--surface); }
  .other-match-text { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .other-match-text .sub { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
  .other-match-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  /* ---------- Edit form ---------- */
  .edit-form {
    margin-top: 16px;
    display: flex;
    gap: 16px;
    padding-top: 16px;
    border-top: 1px dashed var(--border);
  }
  .art-block { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .art-preview {
    width: 88px; height: 88px; border-radius: var(--radius-sm); object-fit: cover;
    background: var(--surface2); border: 1px solid var(--border);
  }
  .art-upload-label { width: 88px; }

  .fields-grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .fields-grid input {
    padding: 9px 11px;
    font-size: 13.5px;
  }
  .fields-grid label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    display: block;
    margin-bottom: 4px;
    font-weight: 600;
  }
  .field-wrap.span2 { grid-column: span 2; }

  .confirm-row { margin-top: 16px; display: flex; justify-content: space-between; align-items: center; }

  .auto-note {
    font-size: 12px; color: var(--muted); margin-top: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .auto-note.matched { color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="brand">YT<span>unes</span></div>
  <div class="subtitle">YouTube &rarr; identified, tagged MP3s</div>
</header>

<main>
  <div class="input-section">
    <input type="text" id="url-input" placeholder="Paste a YouTube video or playlist URL...">
    <button class="btn icon-only" onclick="addUrl()" title="Add"><i class="fa-solid fa-plus"></i></button>
  </div>

  <section>
    <div id="queue-container"><div class="empty">Loading...</div></div>
  </section>
</main>

<script>
const AUTO_MATCH_THRESHOLD = {{ auto_match_threshold }};

let latestTracks = {};   // id -> full track object from server
let formCache = {};      // id -> {title, artist, album, year, genre, track_number, art_url, isCustomArt}

// ---------- Add / background processing ----------

async function addUrl() {
  const input = document.getElementById('url-input');
  const url = input.value.trim();
  if (!url) return;
  input.value = '';
  const resp = await fetch('/add', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({url})
  });
  const data = await resp.json();
  if (data.error) alert(data.error);
  await refreshQueue();
  pollWhileActive();
}

let pollActive = false;
const ACTIVE_STATUSES = ['queued', 'fetching_info', 'downloading', 'analyzing', 'tagging'];

async function pollWhileActive() {
  if (pollActive) return;
  pollActive = true;
  const step = async () => {
    const tracks = await refreshQueue();
    const stillActive = tracks.some(t => ACTIVE_STATUSES.includes(t.status));
    if (stillActive) {
      setTimeout(step, 2000);
    } else {
      pollActive = false;
    }
  };
  step();
}

async function refreshQueue() {
  const resp = await fetch('/queue');
  const tracks = await resp.json();
  latestTracks = {};
  tracks.forEach(t => { latestTracks[t.id] = t; });

  const container = document.getElementById('queue-container');
  if (tracks.length === 0) {
    container.innerHTML = '<div class="empty">Nothing here yet — paste a URL above to get started.</div>';
  } else {
    container.innerHTML = tracks.slice().reverse().map(renderTrack).join('');
  }
  return tracks;
}

// ---------- Rendering ----------

function renderTrack(t) {
  const badgeLabel = t.status.replace(/_/g, ' ');
  let body = '';

  if (t.status === 'needs_review') {
    body = renderReviewBody(t);
  } else if (t.status === 'complete') {
    body = renderCompleteBody(t);
  } else if (t.youtube_reference) {
    body = renderProgressBody(t);
  }

  let rightButton = '<span></span>';
  if (t.status === 'needs_review') {
    rightButton = `<button class="btn" onclick="confirmTrack('${t.id}')"><i class="fa-solid fa-tag"></i> Confirm &amp; Tag</button>`;
  } else if (t.status === 'complete') {
    rightButton = `<a href="/track/${t.id}/download"><button class="btn gray icon-only" title="Download"><i class="fa-solid fa-download"></i></button></a>`;
  }

  return `
    <div class="queue-card status-${t.status}" data-track-id="${t.id}">
      <div class="card-header">
        <div>
          <div class="card-header-title">${escapeHtml(t.video_title)}</div>
          ${t.playlist_title ? `<div class="card-sub">From playlist: ${escapeHtml(t.playlist_title)}</div>` : ''}
        </div>
        <div class="status-badge ${t.status}">${badgeLabel}</div>
      </div>
      ${t.error_message ? `<div class="card-error">${escapeHtml(t.error_message)}</div>` : ''}
      ${body}
      <div class="confirm-row" style="margin-top:12px;">
        <button class="btn gray small icon-only" onclick='removeTrack("${t.id}")' title="Remove"><i class="fa-solid fa-trash"></i></button>
        ${rightButton}
      </div>
    </div>
  `;
}

function renderProgressBody(t) {
  const ref = t.youtube_reference;
  return `
    <div class="review-stack">
      <div class="info-card">
        <div class="info-label"><i class="fa-brands fa-youtube"></i> YouTube</div>
        <div class="info-body">
          ${ref.art_url ? `<img class="info-art" src="${ref.art_url}">` : `<div class="info-art"></div>`}
          <div class="info-text">
            <div class="info-title" title="${escapeAttr(ref.title)}">${escapeHtml(ref.title || 'Untitled')}</div>
            <div class="info-meta" title="${escapeAttr(ref.artist)}">${escapeHtml(ref.artist || 'Unknown channel')}</div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderCompleteBody(t) {
  const s = t.selected || {};
  return `
    <div class="review-stack">
      <div class="info-card">
        <div class="info-label"><i class="fa-solid fa-check"></i> Tagged</div>
        <div class="info-body">
          <img class="info-art" src="/track/${t.id}/art" onerror="this.style.visibility='hidden'" onload="this.style.visibility='visible'">
          <div class="info-text">
            <div class="info-title" title="${escapeAttr(s.title)}">${escapeHtml(s.title || '')}</div>
            <div class="info-meta" title="${escapeAttr(s.artist)}">${escapeHtml(s.artist || '')}${s.album ? ' &middot; ' + escapeHtml(s.album) : ''}</div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderReviewBody(t) {
  const ref = t.youtube_reference || {};
  const candidates = t.candidates || [];
  const top = candidates[0] || null;
  const rest = candidates.slice(1);

  if (!formCache[t.id]) {
    // Auto-fill: a confident match (>= threshold) wins; otherwise fall back
    // to the YouTube reference data rather than a low-confidence guess.
    const useTop = top && top.confidence >= AUTO_MATCH_THRESHOLD;
    const basis = useTop ? top : {
      title: ref.title, artist: ref.artist, album: ref.album,
      year: ref.year, genre: ref.genre, track_number: ref.track_number,
      art_url: ref.art_url,
    };
    formCache[t.id] = { ...basis, isCustomArt: false, autoSource: useTop ? 'match' : 'youtube' };
  }

  return `
    <div id="matches-${t.id}">
      ${renderMatchesSection(t.id, ref, top, rest)}
    </div>
    ${renderEditForm(t.id, formCache[t.id])}
  `;
}

function renderMatchesSection(trackId, ref, top, rest) {
  const originalCard = `
    <div class="info-card">
      <div class="info-label"><i class="fa-brands fa-youtube"></i> Original &middot; YouTube</div>
      <div class="info-body">
        ${ref.art_url ? `<img class="info-art" src="${ref.art_url}">` : `<div class="info-art"></div>`}
        <div class="info-text">
          <div class="info-title" title="${escapeAttr(ref.title)}">${escapeHtml(ref.title || 'Untitled')}</div>
          <div class="info-meta" title="${escapeAttr(ref.artist)}">${escapeHtml(ref.artist || 'Unknown channel')}</div>
        </div>
        <div class="info-actions">
          <button class="btn gray icon-only" onclick='applyCandidate("${trackId}", ${JSON.stringify(ref)})' title="Apply this data"><i class="fa-solid fa-arrow-down"></i></button>
        </div>
      </div>
    </div>
  `;

  const matchCard = top ? `
    <div class="info-card">
      <div class="info-label"><i class="fa-solid fa-star"></i> Best match &middot; ${escapeHtml(top.source)}</div>
      <div class="info-body">
        ${top.art_url ? `<img class="info-art" src="${top.art_url}">` : `<div class="info-art"></div>`}
        <div class="info-text">
          <div class="info-title" title="${escapeAttr(top.title)}">${escapeHtml(top.title)}</div>
          <div class="info-meta" title="${escapeAttr(top.artist)}">${escapeHtml(top.artist)}${top.album ? ' &middot; ' + escapeHtml(top.album) : ''}</div>
        </div>
        <div class="info-actions">
          ${confidenceBadge(top.confidence)}
          ${top.preview_url ? `<button class="btn gray icon-only" onclick='togglePreview(${JSON.stringify(top.preview_url)}, this)' title="Play 30s sample"><i class="fa-solid fa-play"></i></button>` : ''}
          <button class="btn icon-only" onclick='applyCandidate("${trackId}", ${JSON.stringify(top)})' title="Apply this data"><i class="fa-solid fa-arrow-down"></i></button>
        </div>
      </div>
    </div>
  ` : `
    <div class="info-card">
      <div class="info-label"><i class="fa-solid fa-star"></i> Best match</div>
      <div class="info-body">
        <div class="info-art"></div>
        <div class="info-text">
          <div class="info-title" style="color:var(--muted);">No metadata match found</div>
          <div class="info-meta">Try searching below</div>
        </div>
      </div>
    </div>
  `;

  const moreRow = `
    <div class="more-matches-row">
      <input type="text" id="query-${trackId}" placeholder="Search a different query (optional)">
      <button class="btn gray" onclick="findMoreMatches('${trackId}', this)"><i class="fa-solid fa-magnifying-glass"></i> Find more</button>
    </div>
  `;

  const otherHtml = rest.length > 0 ? `
    <div class="other-matches">
      <div class="other-matches-label">Other results (${rest.length})</div>
      ${rest.map(c => `
        <div class="other-match-row">
          <div class="other-match-info">
            ${c.art_url ? `<img src="${c.art_url}">` : ''}
            <div class="other-match-text">
              <div>${escapeHtml(c.title)} &mdash; ${escapeHtml(c.artist)}</div>
              <div class="sub">${escapeHtml(c.album || '')} ${c.year ? '&middot; ' + escapeHtml(c.year) : ''} &middot; ${escapeHtml(c.source)}</div>
            </div>
          </div>
          <div class="other-match-actions">
            ${confidenceBadge(c.confidence)}
            ${c.preview_url ? `<button class="btn gray small icon-only" onclick='togglePreview(${JSON.stringify(c.preview_url)}, this)' title="Play 30s sample"><i class="fa-solid fa-play"></i></button>` : ''}
            <button class="btn gray small icon-only" onclick='applyCandidate("${trackId}", ${JSON.stringify(c)})' title="Apply this data"><i class="fa-solid fa-arrow-down"></i></button>
          </div>
        </div>
      `).join('')}
    </div>
  ` : '';

  return `
    <div class="review-stack">
      ${originalCard}
      ${matchCard}
      ${moreRow}
      ${otherHtml}
    </div>
  `;
}

function confidenceBadge(score) {
  if (score === undefined || score === null) return '';
  const pct = Math.round(score * 100);
  let cls = 'confidence-low';
  if (score >= 0.7) cls = 'confidence-high';
  else if (score >= 0.4) cls = 'confidence-mid';
  return `<span class="confidence-badge ${cls}">${pct}%</span>`;
}

function renderEditForm(trackId, values) {
  const v = values || {};
  const note = v.autoSource === 'match'
    ? `<div class="auto-note matched"><i class="fa-solid fa-star"></i> Auto-filled from a ${Math.round((v.confidence || 0) * 100)}%+ match</div>`
    : (v.autoSource === 'youtube' ? `<div class="auto-note"><i class="fa-brands fa-youtube"></i> Auto-filled from YouTube (no confident match yet)</div>` : '');
  return `
    <div class="edit-form">
      <div class="art-block">
        <img class="art-preview" id="art-preview-${trackId}" src="${v.art_url || ''}" onerror="this.style.visibility='hidden'" onload="this.style.visibility='visible'">
        <label class="btn gray small art-upload-label">
          <i class="fa-solid fa-image"></i> Art
          <input type="file" accept="image/*" style="display:none;" onchange="uploadArt('${trackId}', this)">
        </label>
      </div>
      <div class="fields-grid">
        <div class="field-wrap span2">
          <label>Title</label>
          <input type="text" id="title-${trackId}" value="${escapeAttr(v.title)}" oninput="cacheField('${trackId}','title',this.value)">
        </div>
        <div class="field-wrap span2">
          <label>Artist</label>
          <input type="text" id="artist-${trackId}" value="${escapeAttr(v.artist)}" oninput="cacheField('${trackId}','artist',this.value)">
        </div>
        <div class="field-wrap">
          <label>Album</label>
          <input type="text" id="album-${trackId}" value="${escapeAttr(v.album)}" oninput="cacheField('${trackId}','album',this.value)">
        </div>
        <div class="field-wrap">
          <label>Year</label>
          <input type="text" id="year-${trackId}" value="${escapeAttr(v.year)}" oninput="cacheField('${trackId}','year',this.value)">
        </div>
        <div class="field-wrap">
          <label>Genre</label>
          <input type="text" id="genre-${trackId}" value="${escapeAttr(v.genre)}" oninput="cacheField('${trackId}','genre',this.value)">
        </div>
        <div class="field-wrap">
          <label>Track #</label>
          <input type="text" id="tracknum-${trackId}" value="${escapeAttr(v.track_number)}" oninput="cacheField('${trackId}','track_number',this.value)">
        </div>
      </div>
    </div>
    ${note}
  `;
}

// ---------- Field / candidate interactions ----------

function cacheField(trackId, field, value) {
  if (!formCache[trackId]) formCache[trackId] = {};
  formCache[trackId][field] = value;
  formCache[trackId].autoSource = null;
}

let previewAudio = null;
let previewButton = null;

function togglePreview(url, btn) {
  // Clicking the currently-playing sample's button again stops it.
  if (previewAudio && previewButton === btn) {
    previewAudio.pause();
    resetPreviewButton(btn);
    previewAudio = null;
    previewButton = null;
    return;
  }
  // Switching to a different sample: stop whatever was playing first.
  if (previewAudio) {
    previewAudio.pause();
    resetPreviewButton(previewButton);
  }
  previewAudio = new Audio(url);
  previewButton = btn;
  btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
  previewAudio.play().catch(() => resetPreviewButton(btn));
  previewAudio.onended = () => {
    resetPreviewButton(btn);
    previewAudio = null;
    previewButton = null;
  };
}

function resetPreviewButton(btn) {
  if (btn) btn.innerHTML = '<i class="fa-solid fa-play"></i>';
}

function applyCandidate(trackId, candidate) {
  formCache[trackId] = {
    title: candidate.title || '',
    artist: candidate.artist || '',
    album: candidate.album || '',
    year: candidate.year || '',
    genre: candidate.genre || '',
    track_number: candidate.track_number || '',
    art_url: candidate.art_url || '',
    isCustomArt: false,
    autoSource: null,
  };
  const f = formCache[trackId];
  setIfExists(`title-${trackId}`, f.title);
  setIfExists(`artist-${trackId}`, f.artist);
  setIfExists(`album-${trackId}`, f.album);
  setIfExists(`year-${trackId}`, f.year);
  setIfExists(`genre-${trackId}`, f.genre);
  setIfExists(`tracknum-${trackId}`, f.track_number);
  const preview = document.getElementById(`art-preview-${trackId}`);
  if (preview) preview.src = f.art_url || '';
}

function setIfExists(id, value) {
  const el = document.getElementById(id);
  if (el) el.value = value;
}

async function findMoreMatches(trackId, btn) {
  const queryInput = document.getElementById(`query-${trackId}`);
  const query = queryInput ? queryInput.value.trim() : '';
  btn.disabled = true;
  const originalHtml = btn.innerHTML;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Searching';
  try {
    const resp = await fetch(`/track/${trackId}/more_matches`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query})
    });
    const data = await resp.json();
    if (data.error) { alert(data.error); return; }
    if (latestTracks[trackId]) {
      latestTracks[trackId].candidates = data.candidates;
      const ref = latestTracks[trackId].youtube_reference || {};
      const top = data.candidates[0] || null;
      const rest = data.candidates.slice(1);
      const container = document.getElementById(`matches-${trackId}`);
      if (container) container.innerHTML = renderMatchesSection(trackId, ref, top, rest);
    }
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalHtml;
  }
}

async function uploadArt(trackId, input) {
  if (!input.files.length) return;
  const formData = new FormData();
  formData.append('file', input.files[0]);
  await fetch(`/track/${trackId}/upload_art`, {method: 'POST', body: formData});

  if (!formCache[trackId]) formCache[trackId] = {};
  formCache[trackId].isCustomArt = true;
  formCache[trackId].autoSource = null;
  const objectUrl = URL.createObjectURL(input.files[0]);
  formCache[trackId].art_url = objectUrl;
  const preview = document.getElementById(`art-preview-${trackId}`);
  if (preview) preview.src = objectUrl;
}

async function confirmTrack(trackId) {
  const selected = {
    title: valOf(`title-${trackId}`),
    artist: valOf(`artist-${trackId}`),
    album: valOf(`album-${trackId}`),
    year: valOf(`year-${trackId}`),
    genre: valOf(`genre-${trackId}`),
    track_number: valOf(`tracknum-${trackId}`) || null,
    art_url: (formCache[trackId] && !formCache[trackId].isCustomArt) ? formCache[trackId].art_url : null,
  };
  const resp = await fetch(`/track/${trackId}/confirm`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({selected})
  });
  const data = await resp.json();
  if (data.error) { alert(data.error); return; }
  delete formCache[trackId];
  await refreshQueue();
}

function valOf(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

async function removeTrack(trackId) {
  if (!confirm('Remove this track? If it was already downloaded or tagged, that file will be deleted too.')) return;
  await fetch(`/track/${trackId}`, {method: 'DELETE'});
  delete formCache[trackId];
  refreshQueue();
}

// ---------- Utilities ----------

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function escapeAttr(val) {
  if (val === null || val === undefined) return '';
  return String(val).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

// ---------- Init ----------

refreshQueue().then(tracks => {
  if (tracks.some(t => ACTIVE_STATUSES.includes(t.status))) {
    pollWhileActive();
  }
});
</script>
</body>
</html>
