<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230d0f12'/><text x='50' y='72' font-family='sans-serif' font-size='42' font-weight='bold' fill='%23ff3b3b' text-anchor='middle'>YT</text></svg>">
<title>YTunes</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg:        #0d0f12;
    --surface:   #161920;
    --surface2:  #1e2229;
    --border:    #2a2f3a;
    --accent:    #ff3b3b;
    --accent-soft: rgba(255,59,59,0.10);
    --chrome-1:  #f2f3f5;
    --chrome-2:  #9aa0aa;
    --chrome-3:  #5b606a;
    --gray:      #8a909a;
    --gray-soft: rgba(154,160,170,0.10);
    --danger:    #ff6b6b;
    --text:      #e8ecf1;
    --muted:     #7a8290;
    --radius:    12px;
    --radius-sm: 9px;
    --mono:      'DM Mono', monospace;
    --sans:      'Syne', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 0 0 80px;
    font-size: 15px;
  }

  header { padding: 24px 20px 4px; max-width: min(960px, 94vw); margin: 0 auto; }

  .brand {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(180deg, var(--chrome-1) 0%, var(--chrome-3) 45%, var(--chrome-1) 55%, var(--chrome-2) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .brand span { color: var(--accent); -webkit-text-fill-color: var(--accent); }

  .subtitle { color: var(--muted); font-size: 14px; margin-top: 3px; }

  main { max-width: min(960px, 94vw); margin: 0 auto; padding: 20px; }

  .input-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 24px;
    display: flex;
    gap: 8px;
  }

  input[type="text"] {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: var(--mono);
    font-size: 15px;
    padding: 11px 14px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: var(--muted); }

  /* ---------- Buttons: rounded-square outlines, icon-forward ---------- */
  button { cursor: pointer; font-family: var(--sans); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    background: transparent;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--accent);
    color: var(--accent);
    font-weight: 700;
    font-size: 13px;
    padding: 10px 16px;
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) { background: var(--accent-soft); }
  .btn.gray { border-color: var(--gray); color: var(--chrome-1); }
  .btn.gray:hover:not(:disabled) { background: var(--gray-soft); }
  .btn.small { padding: 7px 12px; font-size: 12px; }
  .btn.icon-only { width: 38px; height: 38px; padding: 0; flex-shrink: 0; }
  .btn.icon-only.small { width: 32px; height: 32px; font-size: 13px; }

  .list-header {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .empty { color: var(--muted); font-size: 14px; padding: 24px 0; text-align: center; }

  .queue-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 14px;
    padding: 16px 18px;
    transition: border-color 0.2s;
  }
  .queue-card.status-needs_review { border-left-color: var(--accent); }
  .queue-card.status-error { border-left-color: var(--danger); }
  .queue-card.status-queued, .queue-card.status-resolving, .queue-card.status-fetching_info,
  .queue-card.status-downloading, .queue-card.status-analyzing,
  .queue-card.status-tagging { border-left-color: var(--chrome-2); }

  .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card-header-title { font-weight: 700; font-size: 16px; line-height: 1.3; }
  .card-sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }

  .status-badge {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: var(--radius-sm);
    background: var(--surface2);
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .status-badge.needs_review { background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(255,59,59,0.3); }
  .status-badge.error { background: rgba(255,107,107,0.12); color: var(--danger); }

  .card-error {
    margin-top: 10px;
    font-size: 13px;
    font-family: var(--mono);
    color: var(--danger);
    background: rgba(255,107,107,0.08);
    border: 1px solid rgba(255,107,107,0.25);
    border-radius: var(--radius-sm);
    padding: 9px 11px;
  }

  /* ---------- Review stack: everything full-width, vertical ---------- */
  .review-stack { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }

  .info-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .info-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .info-body { display: flex; gap: 12px; align-items: center; }
  .info-art {
    width: 60px; height: 60px; border-radius: 8px; object-fit: cover;
    background: var(--surface); border: 1px solid var(--border); flex-shrink: 0;
  }
  .info-text { min-width: 0; flex: 1; }
  .info-title { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .info-meta { font-size: 13px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .info-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .confidence-badge {
    font-family: var(--mono);
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-sm);
    padding: 5px 10px 4px;
    line-height: 1.05;
    min-width: 46px;
    white-space: nowrap;
  }
  .confidence-pct { font-size: 16px; font-weight: 800; }
  .confidence-label { font-size: 8.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.85; margin-top: 1px; }
  .confidence-high { background: var(--accent); color: #fff; border: 1px solid var(--accent); font-weight: 800; }
  .confidence-mid  { background: var(--chrome-2); color: #14161a; border: 1px solid var(--chrome-2); font-weight: 800; }
  .confidence-low  { background: var(--surface); color: var(--muted); border: 1px dashed var(--border); }

  .more-matches-row { display: flex; gap: 8px; }
  .more-matches-row input { flex: 1; }

  .other-matches { display: flex; flex-direction: column; gap: 8px; }
  .other-matches-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted);
  }
  .other-match-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 9px 12px; gap: 10px;
  }
  .other-match-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .other-match-info img { width: 34px; height: 34px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--surface); }
  .other-match-text { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .other-match-text .sub { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
  .other-match-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  /* ---------- Edit form ---------- */
  .edit-form {
    margin-top: 16px;
    display: flex;
    gap: 16px;
    padding-top: 16px;
    border-top: 1px dashed var(--border);
  }
  .art-block { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .art-preview {
    width: 88px; height: 88px; border-radius: var(--radius-sm); object-fit: cover;
    background: var(--surface2); border: 1px solid var(--border);
  }
  .art-upload-label { width: 88px; }

  .fields-grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .fields-grid input {
    padding: 9px 11px;
    font-size: 13.5px;
  }
  .fields-grid label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    display: block;
    margin-bottom: 4px;
    font-weight: 600;
  }
  .field-wrap.span2 { grid-column: span 2; }

  .confirm-row { margin-top: 16px; display: flex; justify-content: space-between; align-items: center; }

  .auto-note {
    font-size: 12px; color: var(--muted); margin-top: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .auto-note.matched { color: var(--accent); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="brand">YT<span>unes</span></div>
  <div class="subtitle">YouTube &rarr; identified, tagged MP3s</div>
</header>

<main>
  <div class="input-section">
    <input type="text" id="url-input" placeholder="Paste a YouTube video or playlist URL...">
    <button class="btn icon-only" id="add-button" title="Add"><i class="fa-solid fa-plus"></i></button>
  </div>

  <section>
    <div id="empty-state" class="empty">Loading...</div>
    <div id="queue-container"></div>
  </section>
</main>

<script>
const AUTO_MATCH_THRESHOLD = {{ auto_match_threshold|tojson }};
const FINGERPRINT_MAX_SECONDS = {{ fingerprint_max_seconds|tojson }};
const STATUS = {{ status_groups|tojson }};   // {in_progress: [...], not_deletable: [...]}

const container = document.getElementById('queue-container');
const emptyState = document.getElementById('empty-state');
const urlInput = document.getElementById('url-input');

const tracks = new Map();           // id -> track from the server (oldest first)
const renderedVersion = new Map();  // id -> track.version the card was last drawn from
const formCache = {};               // id -> edit-form values the user has (or was auto-filled)
const queryCache = {};              // id -> "Find more" search text
const revealedMatches = new Set();  // ids where "Find more" has been clicked

// ---------- Server calls ----------

async function api(url, options = {}) {
  try {
    const resp = await fetch(url, options);
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok && !data.error) data.error = `Request failed (${resp.status})`;
    return data;
  } catch (e) {
    return {error: `Can't reach YTunes: ${e.message}`};
  }
}

function postJson(url, body) {
  return api(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
}

// ---------- Polling ----------

let polling = false;

async function pollWhileActive() {
  if (polling) return;
  polling = true;
  try {
    while (true) {
      const list = await refreshQueue();
      if (!list.some(t => STATUS.in_progress.includes(t.status))) break;
      await new Promise(r => setTimeout(r, 2000));
    }
  } finally {
    polling = false;
  }
}

// Fetch the list and update only the cards whose data changed, so typing,
// focus and a playing preview aren't disturbed by other tracks' progress.
async function refreshQueue() {
  let list;
  try {
    const resp = await fetch('/queue');
    list = await resp.json();
  } catch (e) {
    return [...tracks.values()];
  }

  const ids = new Set(list.map(t => t.id));
  for (const id of tracks.keys()) {
    if (!ids.has(id)) forgetTrack(id);
  }
  tracks.clear();
  list.forEach(t => tracks.set(t.id, t));

  const newestFirst = list.slice().reverse();
  newestFirst.forEach((t, i) => {
    let card = cardEl(t.id);
    if (!card || renderedVersion.get(t.id) !== t.version) {
      card = redrawCard(t, card);
    }
    if (container.children[i] !== card) {
      container.insertBefore(card, container.children[i] || null);
    }
  });

  emptyState.textContent = 'Nothing here yet — paste a URL above to get started.';
  emptyState.classList.toggle('hidden', list.length > 0);
  return list;
}

function cardEl(id) {
  return container.querySelector(`.queue-card[data-track-id="${id}"]`);
}

function forgetTrack(id) {
  const card = cardEl(id);
  if (card) {
    if (preview && card.contains(preview.button)) stopPreview();
    card.remove();
  }
  renderedVersion.delete(id);
  delete formCache[id];
  delete queryCache[id];
  revealedMatches.delete(id);
}

function redrawCard(t, oldCard) {
  const tpl = document.createElement('template');
  tpl.innerHTML = renderTrack(t).trim();
  const card = tpl.content.firstElementChild;

  if (oldCard) {
    // Keep focus and cursor position if the user was typing in this card.
    const active = document.activeElement;
    const focusId = oldCard.contains(active) && active.id ? active.id : null;
    const sel = focusId && 'selectionStart' in active ? [active.selectionStart, active.selectionEnd] : null;
    oldCard.replaceWith(card);
    if (focusId) {
      const el = document.getElementById(focusId);
      if (el) {
        el.focus();
        if (sel && el.setSelectionRange) {
          try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {}
        }
      }
    }
  }
  // Keep a playing preview's pause button in sync with the new markup.
  if (preview) {
    const btn = card.querySelector(`[data-preview-key="${cssEscape(preview.key)}"]`);
    if (btn) {
      preview.button = btn;
      btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
    }
  }
  renderedVersion.set(t.id, t.version);
  return card;
}

// ---------- Rendering ----------

function renderTrack(t) {
  const badgeLabel = t.status.replace(/_/g, ' ');
  let body = '';
  if (t.status === 'needs_review') {
    body = renderReviewBody(t);
  } else if (t.youtube_reference) {
    body = `<div class="review-stack">${renderYoutubeCard(t, false)}</div>`;
  }

  let rightButton = '<span></span>';
  if (t.status === 'needs_review') {
    rightButton = `<button class="btn" data-action="confirm"><i class="fa-solid fa-tag"></i> Confirm &amp; Tag</button>`;
  } else if (t.status === 'error') {
    rightButton = `<button class="btn" data-action="retry"><i class="fa-solid fa-rotate-right"></i> Retry</button>`;
  }

  const removeButton = STATUS.not_deletable.includes(t.status)
    ? `<button class="btn gray small icon-only" disabled title="Can't remove while ${esc(badgeLabel)}"><i class="fa-solid fa-trash"></i></button>`
    : `<button class="btn gray small icon-only" data-action="remove" title="Remove"><i class="fa-solid fa-trash"></i></button>`;

  return `
    <div class="queue-card status-${esc(t.status)}" data-track-id="${esc(t.id)}">
      <div class="card-header">
        <div>
          <div class="card-header-title">${esc(t.video_title)}</div>
          ${t.playlist_title ? `<div class="card-sub">From playlist: ${esc(t.playlist_title)}</div>` : ''}
        </div>
        <div class="status-badge ${esc(t.status)}">${esc(badgeLabel)}</div>
      </div>
      ${t.error_message ? `<div class="card-error">${esc(t.error_message)}</div>` : ''}
      ${body}
      <div class="confirm-row" style="margin-top:12px;">
        ${removeButton}
        ${rightButton}
      </div>
    </div>
  `;
}

function artImg(url, cls) {
  return url ? `<img class="${cls}" src="${esc(url)}" alt="">` : `<div class="${cls}"></div>`;
}

function renderYoutubeCard(t, withActions) {
  const ref = t.youtube_reference || {};
  const actions = withActions ? `
    <div class="info-actions">
      <button class="btn gray icon-only" data-action="preview" data-preview-key="${esc(t.id)}:sample"
              data-src="/track/${esc(t.id)}/sample" data-max-seconds="${FINGERPRINT_MAX_SECONDS}"
              title="Play the ${FINGERPRINT_MAX_SECONDS}s sample used for fingerprinting"><i class="fa-solid fa-play"></i></button>
      <button class="btn gray icon-only" data-action="apply" data-candidate="ref" title="Apply this data"><i class="fa-solid fa-arrow-down"></i></button>
    </div>` : '';
  return `
    <div class="info-card">
      <div class="info-label"><i class="fa-brands fa-youtube"></i> ${withActions ? 'Original &middot; ' : ''}YouTube</div>
      <div class="info-body">
        ${artImg(ref.art_url, 'info-art')}
        <div class="info-text">
          <div class="info-title" title="${esc(ref.title)}">${esc(ref.title || 'Untitled')}</div>
          <div class="info-meta" title="${esc(ref.artist)}">${esc(ref.artist || 'Unknown channel')}</div>
        </div>
        ${actions}
      </div>
    </div>
  `;
}

function renderReviewBody(t) {
  const ref = t.youtube_reference || {};
  const candidates = t.candidates || [];
  const top = candidates[0] || null;

  if (!formCache[t.id]) {
    // Auto-fill: a confident match wins; otherwise use the YouTube data
    // rather than a low-confidence guess.
    const useTop = top && top.confidence >= AUTO_MATCH_THRESHOLD;
    formCache[t.id] = {
      ...formValues(useTop ? top : ref),
      customArt: false,
      autoSource: useTop ? 'match' : 'youtube',
      confidence: useTop ? top.confidence : null,
    };
  }

  return `
    <div class="review-stack">
      ${renderYoutubeCard(t, true)}
      ${renderTopMatch(t.id, top)}
      ${revealedMatches.has(t.id) ? renderOtherMatches(t.id, candidates) : ''}
      <div class="more-matches-row">
        <input type="text" id="query-${esc(t.id)}" data-query placeholder="Search a different query (optional)" value="${esc(queryCache[t.id] || '')}">
        <button class="btn gray" data-action="more"><i class="fa-solid fa-magnifying-glass"></i> Find more</button>
      </div>
    </div>
    ${renderEditForm(t.id, formCache[t.id])}
  `;
}

function renderTopMatch(trackId, top) {
  if (!top) {
    return `
      <div class="info-card">
        <div class="info-label"><i class="fa-solid fa-star"></i> Best match</div>
        <div class="info-body">
          <div class="info-art"></div>
          <div class="info-text">
            <div class="info-title" style="color:var(--muted);">No metadata match found</div>
            <div class="info-meta">Try searching below</div>
          </div>
        </div>
      </div>
    `;
  }
  return `
    <div class="info-card">
      <div class="info-label"><i class="fa-solid fa-star"></i> Best match &middot; ${esc(top.source)}</div>
      <div class="info-body">
        ${artImg(top.art_url, 'info-art')}
        <div class="info-text">
          <div class="info-title" title="${esc(top.title)}">${esc(top.title)}</div>
          <div class="info-meta" title="${esc(top.artist)}">${esc(top.artist)}${top.album ? ' &middot; ' + esc(top.album) : ''}</div>
        </div>
        <div class="info-actions">
          ${confidenceBadge(top.confidence)}
          ${previewButton(trackId, 0, top, '')}
          <button class="btn icon-only" data-action="apply" data-candidate="0" title="Apply this data"><i class="fa-solid fa-arrow-down"></i></button>
        </div>
      </div>
    </div>
  `;
}

function renderOtherMatches(trackId, candidates) {
  const rest = candidates.slice(1);
  if (!rest.length) return '';
  return `
    <div class="other-matches">
      <div class="other-matches-label">Other results (${rest.length})</div>
      ${rest.map((c, i) => `
        <div class="other-match-row">
          <div class="other-match-info">
            ${c.art_url ? `<img src="${esc(c.art_url)}" alt="">` : ''}
            <div class="other-match-text">
              <div>${esc(c.title)} &mdash; ${esc(c.artist)}</div>
              <div class="sub">${esc(c.album || '')} ${c.year ? '&middot; ' + esc(c.year) : ''} &middot; ${esc(c.source)}</div>
            </div>
          </div>
          <div class="other-match-actions">
            ${confidenceBadge(c.confidence)}
            ${previewButton(trackId, i + 1, c, 'small')}
            <button class="btn gray small icon-only" data-action="apply" data-candidate="${i + 1}" title="Apply this data"><i class="fa-solid fa-arrow-down"></i></button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function previewButton(trackId, index, c, size) {
  if (!c.preview_url) return '';
  return `<button class="btn gray ${size} icon-only" data-action="preview" data-preview-key="${esc(trackId)}:${index}"
                  data-src="${esc(c.preview_url)}" title="Play 30s sample"><i class="fa-solid fa-play"></i></button>`;
}

function confidenceBadge(score) {
  if (score === undefined || score === null) return '';
  const pct = Math.round(score * 100);
  let cls = 'confidence-low';
  if (score >= 0.7) cls = 'confidence-high';
  else if (score >= 0.4) cls = 'confidence-mid';
  return `<span class="confidence-badge ${cls}"><span class="confidence-pct">${pct}%</span><span class="confidence-label">match</span></span>`;
}

const FORM_FIELDS = [
  {key: 'title', label: 'Title', wide: true},
  {key: 'artist', label: 'Artist', wide: true},
  {key: 'album', label: 'Album'},
  {key: 'year', label: 'Year'},
  {key: 'genre', label: 'Genre'},
  {key: 'track_number', label: 'Track #'},
];

function formValues(src) {
  const v = {};
  FORM_FIELDS.forEach(f => { v[f.key] = src[f.key] ?? ''; });
  v.art_url = src.art_url || '';
  return v;
}

function renderEditForm(trackId, v) {
  let note = '';
  if (v.autoSource === 'match') {
    note = `<div class="auto-note matched"><i class="fa-solid fa-star"></i> Auto-filled from a ${Math.round((v.confidence || 0) * 100)}% match</div>`;
  } else if (v.autoSource === 'youtube') {
    note = `<div class="auto-note"><i class="fa-brands fa-youtube"></i> Auto-filled from YouTube (no confident match yet)</div>`;
  }
  const id = esc(trackId);
  return `
    <div class="edit-form">
      <div class="art-block">
        <img class="art-preview${v.art_url ? '' : ' hidden'}" id="art-preview-${id}" src="${esc(v.art_url)}" alt="">
        <label class="btn gray small art-upload-label">
          <i class="fa-solid fa-image"></i> Art
          <input type="file" accept="image/*" style="display:none;" data-action="upload-art">
        </label>
      </div>
      <div class="fields-grid">
        ${FORM_FIELDS.map(f => `
          <div class="field-wrap${f.wide ? ' span2' : ''}">
            <label for="${f.key}-${id}">${f.label}</label>
            <input type="text" id="${f.key}-${id}" data-field="${f.key}" value="${esc(v[f.key])}">
          </div>
        `).join('')}
      </div>
    </div>
    ${note}
  `;
}

// ---------- Actions ----------

async function addUrl() {
  const url = urlInput.value.trim();
  if (!url) return;
  urlInput.value = '';
  const data = await postJson('/add', {url});
  if (data.error) {
    alert(data.error);
    urlInput.value = url;
  }
  await refreshQueue();
  pollWhileActive();
}

function applyCandidate(trackId, which) {
  const t = tracks.get(trackId);
  if (!t) return;
  const src = which === 'ref' ? (t.youtube_reference || {}) : (t.candidates || [])[Number(which)];
  if (!src) return;
  // Applying a candidate also switches back from any uploaded art to the
  // candidate's own art.
  formCache[trackId] = {...formValues(src), customArt: false, autoSource: null};
  const f = formCache[trackId];
  FORM_FIELDS.forEach(field => {
    const el = document.getElementById(`${field.key}-${trackId}`);
    if (el) el.value = f[field.key];
  });
  setArtPreview(trackId, f.art_url);
}

function setArtPreview(trackId, url) {
  const img = document.getElementById(`art-preview-${trackId}`);
  if (!img) return;
  img.src = url || '';
  img.classList.toggle('hidden', !url);
}

async function findMoreMatches(trackId, btn) {
  const query = (queryCache[trackId] || '').trim();
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Searching';
  const data = await postJson(`/track/${trackId}/more_matches`, {query});
  if (data.error) alert(data.error);
  else revealedMatches.add(trackId);
  // The card is redrawn from the server's updated list (which re-creates
  // the button in its normal state).
  renderedVersion.delete(trackId);
  await refreshQueue();
}

async function uploadArt(trackId, input) {
  const file = input.files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append('file', file);
  const data = await api(`/track/${trackId}/upload_art`, {method: 'POST', body: formData});
  if (data.error) { alert(data.error); return; }

  const f = formCache[trackId] || (formCache[trackId] = {});
  f.customArt = true;
  f.autoSource = null;
  f.art_url = URL.createObjectURL(file);
  setArtPreview(trackId, f.art_url);
}

async function confirmTrack(trackId, btn) {
  const f = formCache[trackId] || {};
  const selected = {};
  FORM_FIELDS.forEach(field => {
    const el = document.getElementById(`${field.key}-${trackId}`);
    selected[field.key] = el ? el.value.trim() : '';
  });
  selected.track_number = selected.track_number || null;
  selected.art_url = f.customArt ? null : (f.art_url || null);

  btn.disabled = true;
  const data = await postJson(`/track/${trackId}/confirm`, {selected, use_custom_art: !!f.customArt});
  if (data.error) {
    alert(data.error);
    btn.disabled = false;
  }
  await refreshQueue();
}

async function retryTrack(trackId) {
  const data = await postJson(`/track/${trackId}/retry`, {});
  if (data.error) alert(data.error);
  await refreshQueue();
  pollWhileActive();
}

async function removeTrack(trackId) {
  if (!confirm('Remove this track? Its downloaded audio will be deleted too.')) return;
  const data = await api(`/track/${trackId}`, {method: 'DELETE'});
  if (data.error) alert(data.error);
  await refreshQueue();
}

// ---------- Audio preview ----------

let preview = null;   // {audio, key, button}

function togglePreview(btn) {
  const key = btn.dataset.previewKey;
  const wasThis = preview && preview.key === key;
  if (preview) stopPreview();
  if (wasThis) return;

  const audio = new Audio(btn.dataset.src);
  preview = {audio, key, button: btn};
  btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
  audio.play().catch(() => stopPreview());
  audio.onended = stopPreview;
  const maxSeconds = Number(btn.dataset.maxSeconds);
  if (maxSeconds) {
    // The sample is the whole downloaded file; stop where fingerprinting stopped.
    audio.ontimeupdate = () => {
      if (audio.currentTime >= maxSeconds) stopPreview();
    };
  }
}

function stopPreview() {
  if (!preview) return;
  preview.audio.pause();
  if (preview.button) preview.button.innerHTML = '<i class="fa-solid fa-play"></i>';
  preview = null;
}

// ---------- Event wiring ----------

document.getElementById('add-button').addEventListener('click', addUrl);
urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') addUrl(); });

container.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled || el.dataset.action === 'upload-art') return;
  const trackId = el.closest('.queue-card').dataset.trackId;
  switch (el.dataset.action) {
    case 'confirm': confirmTrack(trackId, el); break;
    case 'retry':   retryTrack(trackId); break;
    case 'remove':  removeTrack(trackId); break;
    case 'more':    findMoreMatches(trackId, el); break;
    case 'apply':   applyCandidate(trackId, el.dataset.candidate); break;
    case 'preview': togglePreview(el); break;
  }
});

container.addEventListener('input', e => {
  const card = e.target.closest('.queue-card');
  if (!card) return;
  const trackId = card.dataset.trackId;
  if (e.target.dataset.field) {
    const f = formCache[trackId] || (formCache[trackId] = {});
    f[e.target.dataset.field] = e.target.value;
    f.autoSource = null;
  } else if ('query' in e.target.dataset) {
    queryCache[trackId] = e.target.value;
  }
});

container.addEventListener('keydown', e => {
  if (e.key === 'Enter' && 'query' in e.target.dataset) {
    const btn = e.target.closest('.queue-card').querySelector('[data-action="more"]');
    if (btn && !btn.disabled) btn.click();
  }
});

container.addEventListener('change', e => {
  if (e.target.dataset.action === 'upload-art') {
    uploadArt(e.target.closest('.queue-card').dataset.trackId, e.target);
  }
});

// ---------- Utilities ----------

function esc(val) {
  if (val === null || val === undefined) return '';
  return String(val)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function cssEscape(s) {
  return window.CSS && CSS.escape ? CSS.escape(s) : s.replace(/"/g, '\\"');
}

// ---------- Init ----------

refreshQueue().then(list => {
  if (list.some(t => STATUS.in_progress.includes(t.status))) pollWhileActive();
});
</script>
